<div id="main-container" class="min-h-screen bg-slate-300">

  <h2 class="text-2xl font-bold text-center p-6">Pruebas de Logo</h2>

  <div class="max-w-5xl mx-auto px-4 flex justify-center">

    <div class="h-full overflow-auto">

      <!-- Stack info -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <p-card header="DarkMode" [style]="{
          'background-color': '#1e293b',
          color: '#ffffff'
        }">
          <app-acl-brand-logo variant="dark" size="lg" />
        </p-card>

        <p-card header="LightMode">
          <app-acl-brand-logo variant="light" size="lg" />
        </p-card>

      </div>

    </div>
  </div>

</div>

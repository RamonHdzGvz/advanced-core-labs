<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 py-12 sm:px-8 md:py-16">
  <main class="w-full max-w-xl text-center">
    @if (ready){
    <div class="flex flex-col mb-4 sm:mb-5">
      <p class="text-base sm:text-lg md:text-xl font-bold text-blue-900">ERROR</p>
      <p class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-extrabold text-blue-900">{{ code }}</p>
    </div>

    <h1 class="mt-4 text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-semibold tracking-tight text-gray-800">
      {{ title }}
    </h1>

    <p class="mt-6 text-sm sm:text-base md:text-lg lg:text-xl font-normal text-gray-700">
      {{ description }}
    </p>

    <div class="mt-7 sm:mt-9 flex flex-col sm:flex-row flex-wrap items-center justify-center gap-4">
      <p-button label="Regresar a inicio" icon="pi pi-home" styleClass="text-sm w-full sm:w-auto" routerLink="/"
        severity="secondary" outlined>
      </p-button>
      <!--
      <p-button label="Contactar con soporte" severity="secondary" icon="pi pi-arrow-right" iconPos="right"
        styleClass="text-sm w-full sm:w-auto" [routerLink]="['/support']" [queryParams]="{ subject: 'support' }"
        outlined>
      </p-button>
    -->
    </div>
    }
  </main>
</div>

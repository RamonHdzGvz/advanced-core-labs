<header class="sticky top-0 z-50 border-b border-white/5 bg-[#041222]/90 backdrop-blur-xl">
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8">
    <a routerLink="/" fragment="inicio" (click)="selectSection('inicio')" class="min-w-0 shrink" aria-label="AdvancedCoreLabs, inicio">
      <app-acl-brand-logo variant="dark" size="responsive" />
    </a>

    <nav class="hidden items-center gap-8 lg:flex xl:gap-10" aria-label="Navegación principal">
      <a routerLink="/" fragment="inicio" (click)="selectSection('inicio')" class="nav-link" [class.nav-link--active]="activeSection === 'inicio'" [attr.aria-current]="activeSection === 'inicio' ? 'page' : null">Inicio</a>
      <a routerLink="/soluciones" (click)="selectSection('soluciones')" class="nav-link" [class.nav-link--active]="activeSection === 'soluciones'" [attr.aria-current]="activeSection === 'soluciones' ? 'page' : null">Soluciones</a>
      <a routerLink="/" fragment="tecnologia" (click)="selectSection('tecnologia')" class="nav-link" [class.nav-link--active]="activeSection === 'tecnologia'" [attr.aria-current]="activeSection === 'tecnologia' ? 'location' : null">Tecnología</a>
      <a routerLink="/" fragment="nosotros" (click)="selectSection('nosotros')" class="nav-link" [class.nav-link--active]="activeSection === 'nosotros'" [attr.aria-current]="activeSection === 'nosotros' ? 'location' : null">Nosotros</a>
    </nav>

    <a routerLink="/" fragment="contacto" (click)="selectSection('contacto')" class="hidden rounded-xl bg-acl-primary px-7 py-3.5 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/20 transition hover:bg-acl-primary-hover lg:inline-flex">Contáctanos</a>
    <button type="button" class="rounded-lg p-2 text-white lg:hidden" (click)="isOpen = !isOpen" [attr.aria-expanded]="isOpen" aria-controls="mobile-navigation" aria-label="Alternar menú">
      <span class="text-2xl" aria-hidden="true">{{ isOpen ? '×' : '☰' }}</span>
    </button>
  </div>

  @if (isOpen) {
    <nav id="mobile-navigation" class="flex flex-col gap-1 border-t border-white/10 px-6 py-3 lg:hidden" aria-label="Navegación móvil">
      <a routerLink="/" fragment="inicio" (click)="selectSection('inicio')" class="rounded-lg px-3 py-2 text-slate-200 hover:text-acl-primary" [class.nav-link--active]="activeSection === 'inicio'">Inicio</a>
      <a routerLink="/soluciones" (click)="selectSection('soluciones')" class="rounded-lg px-3 py-2 text-slate-200 hover:text-acl-primary" [class.nav-link--active]="activeSection === 'soluciones'">Soluciones</a>
      <a routerLink="/" fragment="tecnologia" (click)="selectSection('tecnologia')" class="rounded-lg px-3 py-2 text-slate-200 hover:text-acl-primary" [class.nav-link--active]="activeSection === 'tecnologia'">Tecnología</a>
      <a routerLink="/" fragment="nosotros" (click)="selectSection('nosotros')" class="rounded-lg px-3 py-2 text-slate-200 hover:text-acl-primary" [class.nav-link--active]="activeSection === 'nosotros'">Nosotros</a>
      <a routerLink="/" fragment="contacto" (click)="selectSection('contacto')" class="mt-2 rounded-lg bg-acl-primary px-3 py-2 text-center font-semibold text-slate-950">Contáctanos</a>
    </nav>
  }
</header>

<main class="grid min-h-screen place-items-center bg-slate-950 px-6 text-white">
  <section class="w-full max-w-md rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl">
    <p class="text-sm font-semibold uppercase tracking-[0.2em] text-indigo-300">
      Subdominio secured
    </p>
    <h1 class="mt-4 text-3xl font-bold tracking-tight">Login</h1>
    <p class="mt-3 leading-7 text-slate-300">Inicia sesión para acceder a Home.</p>

    @if (isSupabaseConfigured) {
      <app-login-form
        class="mt-8 block"
        [isSubmitting]="isSubmitting()"
        [errorMessage]="errorMessage()"
        (submitted)="signIn($event)"
      />
    } @else {
      <p
        class="mt-8 rounded-xl border border-amber-300/20 bg-amber-300/10 px-4 py-3 text-sm leading-6 text-amber-100"
        role="status"
      >
        Supabase aún no está configurado. Agrega la clave publishable del proyecto para habilitar el
        inicio de sesión.
      </p>
    }
  </section>
</main>

<main class="min-h-screen bg-canvas px-6 py-12 text-content">
  <section class="mx-auto w-full max-w-3xl space-y-8">
    <header>
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">
        Subdominio secured
      </p>
      <h1 class="mt-2 text-4xl font-bold tracking-tight">Perfil</h1>
      <p class="mt-3 text-content-muted">Sesión iniciada con {{ email() }}</p>
    </header>

    <app-profile-picture-uploader [imageUrl]="avatarUrl()" [userName]="email()" />

    <a
      routerLink="/"
      class="inline-flex rounded-theme-md bg-primary px-5 py-3 font-semibold text-on-primary shadow-sm transition hover:bg-primary-hover focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-focus-ring/30"
    >
      Regresar a Home
    </a>
  </section>
</main>

<div
  class="pointer-events-none fixed right-4 top-4 z-[100] flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-3"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="pointer-events-auto relative [&>div]:pr-10">
      <app-theme-alert [tone]="toast.tone" [title]="toast.title" [message]="toast.message" />
      <button
        class="absolute right-2 top-2 flex size-7 items-center justify-center rounded-theme-sm text-current opacity-70 hover:bg-black/5 hover:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus-ring dark:hover:bg-white/10"
        type="button"
        [attr.aria-label]="'Cerrar aviso: ' + toast.title"
        (click)="toastService.dismiss(toast.id)"
      >
        ×
      </button>
    </div>
  }
</div>

<app-theme-button
  variant="secondary"
  size="sm"
  [ariaPressed]="isDark()"
  [ariaLabel]="isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
  (pressed)="toggle()"
>
  @if (isDark()) {
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path
        stroke-linecap="round"
        stroke-width="1.8"
        d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
      />
    </svg>
    <span>Claro</span>
  } @else {
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"
      />
    </svg>
    <span>Oscuro</span>
  }
</app-theme-button>

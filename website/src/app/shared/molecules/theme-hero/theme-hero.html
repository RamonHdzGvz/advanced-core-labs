<section
  class="relative isolate overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-700 via-violet-700 to-fuchsia-700 px-7 py-10 text-white shadow-xl sm:px-12 sm:py-14"
>
  <div class="absolute -right-16 -top-24 -z-10 size-80 rounded-full bg-white/10 blur-3xl"></div>
  <div
    class="absolute -bottom-32 right-1/3 -z-10 size-72 rounded-full bg-fuchsia-300/20 blur-3xl"
  ></div>
  <div class="max-w-2xl">
    <p
      class="mb-4 inline-flex rounded-full border border-white/20 bg-white/10 px-3 py-1.5 text-xs font-semibold tracking-wide text-indigo-50"
    >
      {{ eyebrow }}
    </p>
    <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">{{ title }}</h1>
    <p class="mt-4 max-w-xl text-base leading-7 text-indigo-100 sm:text-lg">{{ description }}</p>
    <div class="mt-8 flex flex-wrap gap-3">
      @if (primaryActionLabel && primaryActionHref) {
        <a
          [href]="primaryActionHref"
          class="inline-flex items-center gap-2 rounded-theme-lg bg-white px-5 py-3 text-sm font-semibold text-indigo-700 shadow-sm transition hover:bg-indigo-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white/30"
        >
          {{ primaryActionLabel }}
          <svg
            class="size-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 12h14m-6-6 6 6-6 6"
            />
          </svg>
        </a>
      }
      @if (secondaryActionLabel && secondaryActionHref) {
        <a
          [href]="secondaryActionHref"
          class="inline-flex items-center rounded-theme-lg border border-white/30 px-5 py-3 text-sm font-semibold text-white transition hover:bg-white/10 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-white/20"
        >
          {{ secondaryActionLabel }}
        </a>
      }
    </div>
  </div>
  <div
    class="absolute bottom-8 right-10 hidden rounded-2xl border border-white/20 bg-white/10 p-4 shadow-2xl backdrop-blur-sm lg:block"
  >
    <div class="flex items-center gap-3">
      <div class="flex -space-x-2">
        <app-theme-avatar
          initials="AL"
          tone="amber"
          size="sm"
          class="rounded-full ring-2 ring-white/70"
        />
        <app-theme-avatar
          initials="MR"
          tone="neutral"
          size="sm"
          class="rounded-full ring-2 ring-white/70"
        />
        <app-theme-avatar
          initials="JS"
          tone="rose"
          size="sm"
          class="rounded-full ring-2 ring-white/70"
        />
      </div>
      <div>
        <p class="text-sm font-semibold">Listo para personalizar</p>
        <p class="text-xs text-indigo-100">Componentes compartidos</p>
      </div>
    </div>
  </div>
</section>
